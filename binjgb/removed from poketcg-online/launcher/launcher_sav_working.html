<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG RAM-Sync Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Fira Code', monospace; }
        canvas { 
            image-rendering: pixelated; 
            width: 480px; 
            height: 432px; 
            background: #000; 
            border: 4px solid #334155;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            outline: none;
        }
        canvas:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
        }
        .log-line { border-left: 2px solid #3b82f6; padding-left: 8px; margin-bottom: 4px; font-size: 0.75rem; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

    <div class="w-full max-w-6xl flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-lg border border-slate-700">
        <div>
            <h1 class="text-xl font-bold text-blue-400">TCG RAM-SYNC <span class="text-xs text-slate-500 font-normal">v0.4.0</span></h1>
            <div class="text-sm">STATUS: <span id="conn-status" class="text-yellow-500 font-bold uppercase">Disconnected</span></div>
        </div>
        <div class="flex gap-4 items-center">
            <div class="text-right">
                <div class="text-[10px] text-slate-400">MY ID</div>
                <div id="my-id" class="text-sm font-bold text-white tracking-widest">----</div>
            </div>
            <input type="text" id="remote-id" placeholder="PARTNER ID" class="bg-slate-900 border border-slate-600 px-3 py-1 rounded text-sm focus:outline-none focus:border-blue-500">
            <button id="btn-connect" class="bg-blue-600 hover:bg-blue-500 px-4 py-1 rounded text-sm font-bold transition">CONNECT</button>
        </div>
    </div>

    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-3 flex flex-col gap-4">
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-tighter">File Management</h3>
                
                <div class="space-y-2">
                    <label class="block">
                        <span class="text-[10px] text-slate-500 uppercase block mb-1">1. Choose ROM</span>
                        <input type="file" id="rom-upload" accept=".gbc,.gb" class="text-xs w-full block text-slate-400 file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
                    </label>

                    <label class="block">
                        <span class="text-[10px] text-slate-500 uppercase block mb-1">2. Choose Save (Optional)</span>
                        <input type="file" id="sav-upload" accept=".sav" class="text-xs w-full block text-slate-400 file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
                    </label>

                    <button id="btn-start" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded text-xs font-bold mt-2 transition-all">START ENGINE</button>
                    <button id="btn-download-sav" class="w-full bg-emerald-700 hover:bg-emerald-600 py-2 rounded text-xs font-bold disabled:opacity-30 disabled:cursor-not-allowed" disabled>DOWNLOAD CURRENT SAVE</button>
                </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 flex-1 flex flex-col overflow-hidden max-h-[400px]">
                <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-tighter">System Log</h3>
                <div id="system-logs" class="overflow-y-auto flex-1 font-mono text-slate-300 hide-scroll">
                    <div class="log-line">Ready to load files...</div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-6 flex flex-col items-center">
            <div class="relative group">
                <canvas id="gb-canvas" width="160" height="144" tabindex="0"></canvas>
                <div id="focus-overlay" class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center cursor-pointer opacity-100 transition-opacity z-20 hidden">
                    <span class="text-white font-bold text-sm bg-blue-600 px-6 py-3 rounded-full shadow-2xl mb-2">CLICK TO RESUME AUDIO</span>
                </div>
                <div class="crt-overlay pointer-events-none"></div>
            </div>
            
            <div class="mt-4 grid grid-cols-4 gap-4 w-full text-center text-[10px] text-slate-500">
                <div>ARROWS: D-PAD</div>
                <div>X: A / Z: B</div>
                <div>ENTER: START</div>
                <div>TAB: SELECT</div>
            </div>
        </div>

        <div class="lg:col-span-3 flex flex-col gap-4">
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <h3 class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-tighter">RAM Sync Status</h3>
                <div class="flex justify-between items-center bg-slate-900 p-2 rounded mb-1">
                    <span class="text-[10px]">P1_READY ($C2FF)</span>
                    <span id="p1-flag" class="w-3 h-3 rounded-full bg-slate-700"></span>
                </div>
                <div class="flex justify-between items-center bg-slate-900 p-2 rounded">
                    <span class="text-[10px]">P2_READY ($C3FF)</span>
                    <span id="p2-flag" class="w-3 h-3 rounded-full bg-slate-700"></span>
                </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 flex-1 flex flex-col overflow-hidden max-h-[400px]">
                <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-tighter">Link Chat</h3>
                <div id="chat-box" class="flex-1 overflow-y-auto text-[11px] mb-2 space-y-1 hide-scroll"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="Say something..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none">
                </div>
            </div>
        </div>
    </div>

    <script src="binjgb.js"></script>

    <script>
        const $ = (id) => document.getElementById(id);
        const log = (msg) => {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            $('system-logs').appendChild(div);
            $('system-logs').scrollTop = $('system-logs').scrollHeight;
        };

        // --- GLOBAL STATE ---
        let module = null;
        let emulatorPtr = null;
        let audio = null;
        let joypadPtr = null;
        let keyFuncs = {};
        let animationFrameReq = null;
        let wramCachedPtr = null;

        // --- WASM HELPER ---
        function getExport(name) {
            if (!module) return null;
            const names = [name, `_${name}`, `asm.${name}`];
            for (const n of names) {
                if (typeof module[n] === 'function') return module[n];
                if (module.asm && typeof module.asm[n] === 'function') return module.asm[n];
            }
            return null;
        }

        function makeWasmBuffer(ptr, size) {
            return new Uint8Array(module.HEAP8.buffer, ptr, size);
        }

        // --- AUDIO ENGINE ---
        class GameAudio {
            constructor(m, e) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.module = m;
                const getPtr = getExport('get_audio_buffer_ptr');
                const getCap = getExport('get_audio_buffer_capacity');
                if (getPtr && getCap) {
                    this.ptr = getPtr(e);
                    this.capacity = getCap(e);
                    this.buffer = new Uint8Array(this.module.HEAP8.buffer, this.ptr, this.capacity);
                }
                this.startSec = 0;
            }
            push() {
                if (!this.ctx || this.ctx.state === 'suspended') return;
                const nowSec = this.ctx.currentTime;
                const latency = 0.1;
                this.startSec = (this.startSec || nowSec + latency);
                if (this.startSec < nowSec) this.startSec = nowSec + latency;
                const frames = 4096;
                const buffer = this.ctx.createBuffer(2, frames, this.ctx.sampleRate);
                const c0 = buffer.getChannelData(0);
                const c1 = buffer.getChannelData(1);
                for (let i = 0; i < frames; i++) {
                    c0[i] = (this.buffer[2 * i] / 255) * 0.4;
                    c1[i] = (this.buffer[2 * i + 1] / 255) * 0.4;
                }
                const source = this.ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(this.ctx.destination);
                source.start(this.startSec);
                this.startSec += frames / this.ctx.sampleRate;
            }
        }

        // --- EMULATOR INIT ---
        async function initEmulator(romBuffer, savBuffer = null) {
            if (animationFrameReq) cancelAnimationFrame(animationFrameReq);
            if (emulatorPtr && module) {
                const del = getExport('emulator_delete');
                if (del) del(emulatorPtr);
                module._free(module.romDataPtr);
            }

            log("Loading WASM module...");
            module = await Binjgb();
            wramCachedPtr = null;

            // 1. Allocate ROM
            const size = (romBuffer.byteLength + 0x7fff) & ~0x7fff;
            const malloc = getExport('malloc');
            module.romDataPtr = malloc(size); // Store ptr to free later
            
            // Zero fill and copy
            makeWasmBuffer(module.romDataPtr, size).fill(0).set(new Uint8Array(romBuffer));

            // 2. Create Emulator
            const eNew = getExport('emulator_new_simple');
            // rom_ptr, rom_size, sample_rate, audio_frames, color_curve
            emulatorPtr = eNew(module.romDataPtr, size, 44100, 4096, 2); 
            log("Emulator instance created.");

            // 3. Inject Save Data (Directly via File Data Struct)
            if (savBuffer && savBuffer.byteLength > 0) {
                const extRamFileNew = getExport('ext_ram_file_data_new');
                const getFileDataPtr = getExport('get_file_data_ptr');
                const getFileDataSize = getExport('get_file_data_size');
                const readExtRam = getExport('emulator_read_ext_ram');
                const fileDataDelete = getExport('file_data_delete');

                // Create a FileData struct for External RAM
                const fileDataPtr = extRamFileNew(emulatorPtr);
                const bufferPtr = getFileDataPtr(fileDataPtr);
                const bufferSize = getFileDataSize(fileDataPtr);

                const saveArray = new Uint8Array(savBuffer);
                
                // Copy save data into the engine's buffer
                const destBuffer = makeWasmBuffer(bufferPtr, bufferSize);
                if (saveArray.length <= bufferSize) {
                    destBuffer.set(saveArray);
                    // Tell engine to read from this buffer into SRAM
                    readExtRam(emulatorPtr, fileDataPtr);
                    log(`SRAM Injected: ${saveArray.length} bytes.`);
                } else {
                    log("Warning: Save file larger than cartridge RAM size.");
                }
                
                // Clean up the FileData struct
                fileDataDelete(fileDataPtr);
            }

            // 4. Input Setup
            const jNew = getExport('joypad_new');
            const jSet = getExport('emulator_set_default_joypad_callback');
            if (jNew && jSet) {
                joypadPtr = jNew();
                jSet(emulatorPtr, joypadPtr);
                setupInput();
            }

            audio = new GameAudio(module, emulatorPtr);
            $('btn-download-sav').disabled = false;
            log("Engine active.");
            
            tick();
        }

        function setupInput() {
            const keyBindings = {
                'ArrowDown': 'set_joyp_down', 'ArrowLeft': 'set_joyp_left',
                'ArrowRight': 'set_joyp_right', 'ArrowUp': 'set_joyp_up',
                'KeyZ': 'set_joyp_B', 'KeyX': 'set_joyp_A',
                'Enter': 'set_joyp_start', 'Tab': 'set_joyp_select'
            };
            Object.keys(keyBindings).forEach(code => {
                const fn = getExport(keyBindings[code]);
                if (fn) keyFuncs[code] = (pressed) => fn(emulatorPtr, pressed);
            });
        }

        function getWram() {
            if (!module || !emulatorPtr) return null;
            if (wramCachedPtr && wramCachedPtr.buffer.byteLength > 0) return wramCachedPtr;
            
            const getW = getExport('get_wram_ptr');
            if (getW) {
                const ptr = getW(emulatorPtr);
                if (ptr) {
                    wramCachedPtr = new Uint8Array(module.HEAP8.buffer, ptr, 0x8000); 
                    return wramCachedPtr;
                }
            }
            return null;
        }

        function tick() {
            if (!module || !emulatorPtr) return;
            const ticksPerFrame = 70224;
            const getTicks = getExport('emulator_get_ticks_f64');
            const runUntil = getExport('emulator_run_until_f64');
            
            let targetTicks = getTicks(emulatorPtr) + ticksPerFrame;
            while (getTicks(emulatorPtr) < targetTicks) {
                const result = runUntil(emulatorPtr, targetTicks);
                if ((result & 2) && audio) audio.push(); 
                if (result & 4) break; 
            }

            const ctx = $('gb-canvas').getContext('2d');
            const getFb = getExport('get_frame_buffer_ptr');
            if (getFb) {
                const fbPtr = getFb(emulatorPtr);
                const frameData = new Uint8ClampedArray(module.HEAPU8.buffer, fbPtr, 160 * 144 * 4);
                ctx.putImageData(new ImageData(frameData, 160, 144), 0, 0);
            }

            syncRamLogic();
            animationFrameReq = requestAnimationFrame(tick);
        }

        function syncRamLogic() {
            const wram = getWram();
            if (!wram) return;
            const p1 = wram[0x2FF];
            const p2 = wram[0x3FF];
            
            $('p1-flag').className = `w-3 h-3 rounded-full ${p1 > 0 ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-slate-700'}`;
            $('p2-flag').className = `w-3 h-3 rounded-full ${p2 > 0 ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-slate-700'}`;
            
            if (p1 > 0 && connection?.open) {
                connection.send({ 
                    type: 'ram_sync', 
                    address: 0xC200, 
                    payload: Array.from(wram.slice(0x200, 0x300)) 
                });
            }
        }

        // --- UI & EVENTS ---
        $('btn-start').onclick = async () => {
            const romFile = $('rom-upload').files[0];
            const savFile = $('sav-upload').files[0];
            if (!romFile) return log("Error: No ROM selected.");

            const romBuffer = await romFile.arrayBuffer();
            let savBuffer = null;
            if (savFile) {
                savBuffer = await savFile.arrayBuffer();
                log(`Save file detected: ${savBuffer.byteLength} bytes`);
            }

            await initEmulator(romBuffer, savBuffer);
            $('focus-overlay').classList.remove('hidden');
        };

        $('btn-download-sav').onclick = () => {
            if (!module || !emulatorPtr) return;
            
            const extRamFileNew = getExport('ext_ram_file_data_new');
            const getFileDataPtr = getExport('get_file_data_ptr');
            const getFileDataSize = getExport('get_file_data_size');
            const writeExtRam = getExport('emulator_write_ext_ram');
            const fileDataDelete = getExport('file_data_delete');

            const fileDataPtr = extRamFileNew(emulatorPtr);
            writeExtRam(emulatorPtr, fileDataPtr); // Write SRAM to buffer
            
            const bufferPtr = getFileDataPtr(fileDataPtr);
            const bufferSize = getFileDataSize(fileDataPtr);
            
            if (bufferSize > 0) {
                const savData = new Uint8Array(module.HEAP8.buffer, bufferPtr, bufferSize);
                const blob = new Blob([savData], { type: 'application/octet-stream' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'game.sav';
                a.click();
                log("Save data exported.");
            }
            fileDataDelete(fileDataPtr);
        };

        let peer = null;
        let connection = null;

        function initPeer() {
            peer = new Peer();
            peer.on('open', (id) => { $('my-id').innerText = id; log("P2P Signaling Online."); });
            peer.on('connection', setupConnection);
        }

        function setupConnection(conn) {
            connection = conn;
            $('conn-status').innerText = "LINKED";
            $('conn-status').className = "text-green-500 font-bold uppercase";
            log(`Partner Connected: ${conn.peer}`);
            conn.on('data', (data) => {
                if (data.type === 'chat') addChatMessage('PARTNER', data.msg);
                if (data.type === 'ram_sync') {
                    const wram = getWram();
                    if (wram) wram.set(data.payload, data.address - 0xC000);
                }
            });
        }

        $('btn-connect').onclick = () => {
            const rid = $('remote-id').value;
            if (rid) setupConnection(peer.connect(rid));
        };

        function addChatMessage(sender, msg) {
            const div = document.createElement('div');
            div.innerHTML = `<span class="${sender === 'YOU' ? 'text-blue-400' : 'text-pink-400'} font-bold">${sender}:</span> ${msg}`;
            $('chat-box').appendChild(div);
            $('chat-box').scrollTop = $('chat-box').scrollHeight;
        }

        $('chat-input').onkeydown = (e) => {
            if (e.key === 'Enter' && e.target.value && connection?.open) {
                connection.send({ type: 'chat', msg: e.target.value });
                addChatMessage('YOU', e.target.value);
                e.target.value = '';
            }
        };

        $('focus-overlay').onclick = () => {
            if (audio?.ctx) audio.ctx.resume();
            $('gb-canvas').focus();
            $('focus-overlay').classList.add('hidden');
        };

        window.addEventListener('keydown', (e) => {
            if (keyFuncs[e.code] && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                keyFuncs[e.code](true);
            }
        });
        window.addEventListener('keyup', (e) => {
            if (keyFuncs[e.code] && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                keyFuncs[e.code](false);
            }
        });

        initPeer();
    </script>
</body>
</html>
