<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Netplay Bridge (binjgb Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas { image-rendering: pixelated; width: 320px; height: 288px; background: #000; cursor: pointer; outline: none; }
        .log-window { font-family: monospace; font-size: 11px; height: 140px; overflow-y: auto; border: 1px solid #333; }
        .chat-window { height: 180px; overflow-y: auto; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .status-online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-offline { background: #ef4444; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        #focus-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; align-items: center;
            justify-content: center; color: white; font-weight: bold;
            pointer-events: none; opacity: 1; transition: opacity 0.3s;
            z-index: 10;
        }
        .canvas-container:focus-within #focus-overlay { opacity: 0; }
    </style>
</head>
<body class="bg-zinc-900 text-white p-4 font-sans text-sm">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Emulator & Files -->
        <div class="lg:col-span-4 space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <h2 class="text-lg font-bold">Game Window</h2>
                <div id="connection-status" class="text-xs text-zinc-400">
                    <span class="status-dot status-offline"></span>Disconnected
                </div>
            </div>
            
            <div class="bg-black p-2 rounded-xl shadow-2xl flex flex-col items-center relative canvas-container" onclick="document.getElementById('gb-canvas').focus()">
                <canvas id="gb-canvas" width="160" height="144" class="rounded shadow-inner shadow-zinc-800" tabindex="0"></canvas>
                <div id="focus-overlay" class="text-[10px] uppercase tracking-tighter">Click Game to Enable Controls</div>
                <div class="w-full mt-2 flex justify-between text-[10px] text-zinc-500 uppercase tracking-widest px-2">
                    <span>160 x 144 (Native)</span>
                    <span id="emulator-status">Waiting...</span>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-500 font-bold px-1 text-center block">Local Files</label>
                    <div class="flex gap-2">
                        <button onclick="document.getElementById('rom-upload').click()" class="flex-1 bg-zinc-800 border border-zinc-700 py-2 rounded-lg hover:bg-zinc-700 transition text-xs">Load ROM</button>
                    </div>
                    <input type="file" id="rom-upload" class="hidden" accept=".gbc,.gb">
                </div>
            </div>

            <div class="bg-black rounded-xl p-3 space-y-2 border border-zinc-800">
                <div class="text-[10px] uppercase text-zinc-500 font-bold">Bridge Engine Logs</div>
                <div id="logs" class="log-window p-2 bg-zinc-950/50 text-zinc-500 border border-zinc-900 shadow-inner">
                    Starting Bridge...
                </div>
            </div>
        </div>

        <!-- Right Column: Netplay Controls & Chat -->
        <div class="lg:col-span-8 space-y-4">
            <h2 class="text-lg font-bold border-b border-zinc-800 pb-2">P2P RAM Synchronizer</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-zinc-800/50 p-4 rounded-xl border border-zinc-700/50 space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase text-zinc-500 font-bold mb-2">My Local ID</label>
                        <div class="flex gap-2">
                            <input id="peer-id" type="text" readonly class="bg-black/40 border border-zinc-700 rounded-lg px-3 py-2 flex-1 text-sm font-mono text-blue-400">
                            <button onclick="copyPeerId()" class="bg-zinc-700 px-4 py-2 rounded-lg text-sm hover:bg-zinc-600 transition">Copy</button>
                        </div>
                    </div>
                </div>

                <div class="bg-zinc-800/50 p-4 rounded-xl border border-zinc-700/50 space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase text-zinc-500 font-bold mb-2">Target Friend ID</label>
                        <div class="flex gap-2">
                            <input id="remote-id" type="text" placeholder="Paste ID..." class="bg-black/40 border border-zinc-700 rounded-lg px-3 py-2 flex-1 text-sm font-mono focus:border-blue-500 outline-none transition">
                            <button id="connect-btn" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-500 transition">Connect</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Communication Link -->
            <div class="bg-zinc-800/30 rounded-xl border border-zinc-800 overflow-hidden flex flex-col">
                <div class="bg-zinc-800/80 px-4 py-2 border-b border-zinc-700 flex justify-between items-center">
                    <span class="text-xs font-bold uppercase tracking-wider text-zinc-400">Communication Link</span>
                    <span id="chat-peer-name" class="text-[10px] text-zinc-500 italic">Idle</span>
                </div>
                <div id="chat-messages" class="chat-window p-4 bg-zinc-900/50 space-y-3">
                    <div class="text-center text-zinc-600 text-[10px] mt-4">System ready for session.</div>
                </div>
                <div class="p-3 bg-zinc-800/50 border-t border-zinc-700 flex gap-2">
                    <input id="chat-input" type="text" placeholder="Type to peer..." disabled class="bg-zinc-950 border border-zinc-700 rounded-lg px-4 py-2 flex-1 text-sm focus:border-blue-500 outline-none disabled:opacity-50">
                    <button id="chat-send" disabled class="bg-zinc-700 px-4 py-2 rounded-lg text-xs font-bold hover:bg-zinc-600 disabled:opacity-50 transition">Send</button>
                </div>
            </div>

            <!-- Manual Sync Controls -->
            <div class="bg-zinc-950/40 border border-dashed border-zinc-700 rounded-xl p-4 mt-4">
                <div class="text-[10px] uppercase text-zinc-500 font-bold mb-3 flex items-center gap-2">
                    RAM Diagnostic Tools
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="simulateSync('P1')" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 px-3 py-1 rounded text-[10px]">Force P1 Send Flag</button>
                    <button onclick="simulateSync('P2')" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 px-3 py-1 rounded text-[10px]">Force P2 Send Flag</button>
                    <button onclick="inspectRam()" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-600 px-3 py-1 rounded text-[10px]">Console Dump WRAM</button>
                </div>
            </div>
        </div>
    </div>

    <!-- P2P Networking -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <!-- Emulator Script -->
    <script src="binjgb.js"></script>

    <script>
        let module = null;
        let emulatorPtr = null;
        let wram = null;
        let isP1 = false;
        let conn = null;
        let joypadState = 0; 

        // GB Joypad Constants (Standard bitmask)
        const JOYP_A = 0;
        const JOYP_B = 1;
        const JOYP_SELECT = 2;
        const JOYP_START = 3;
        const JOYP_RIGHT = 4;
        const JOYP_LEFT = 5;
        const JOYP_UP = 6;
        const JOYP_DOWN = 7;

        const buttonNames = ["A", "B", "SELECT", "START", "RIGHT", "LEFT", "UP", "DOWN"];

        const log = (msg, color = 'zinc-500') => {
            const div = document.getElementById('logs');
            const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            div.innerHTML += `<div class="mb-1 text-[10px]"><span class="text-zinc-700">[${time}]</span> <span class="text-${color}">${msg}</span></div>`;
            div.scrollTop = div.scrollHeight;
        };

        async function startEngine(romData) {
            try {
                if (typeof Binjgb === 'undefined') {
                    log("Error: binjgb.js not loaded.", "red-400");
                    return;
                }

                log("Initializing Engine...", "blue-400");
                
                module = await Binjgb({
                    locateFile: (path) => path
                });

                const romPtr = module._malloc(romData.length);
                module.HEAPU8.set(romData, romPtr);

                emulatorPtr = module._emulator_new_simple(romPtr, romData.length, 44100, 4194304);

                if (!emulatorPtr) throw new Error("Failed to create emulator instance.");

                const wramPtr = module._emulator_get_wram_ptr(emulatorPtr);
                wram = new Uint8Array(module.HEAPU8.buffer, wramPtr, 8192);
                
                document.getElementById('emulator-status').innerText = "Engine Active";
                log("ROM Loaded. Controls: Z=A, X=B, Enter=Start, Shift=Select.", "green-400");
                
                joypadState = 0;
                requestAnimationFrame(tick);
            } catch (err) {
                log(`Startup Failure: ${err.message}`, "red-500");
                console.error(err);
            }
        }

        function tick() {
            if (!module || !emulatorPtr) return;
            
            updateJoypad();

            // Advance frame (approx 16.6ms)
            module._emulator_run_until_f64(emulatorPtr, module._emulator_get_ticks_f64(emulatorPtr) + 70224);
            
            const canvas = document.getElementById('gb-canvas');
            const ctx = canvas.getContext('2d');
            
            const fbPtr = module._get_frame_buffer_ptr(emulatorPtr);
            const fbSize = module._get_frame_buffer_size(emulatorPtr);
            const frameData = new Uint8ClampedArray(module.HEAPU8.buffer, fbPtr, fbSize);
            
            const imageData = new ImageData(frameData, 160, 144);
            ctx.putImageData(imageData, 0, 0);

            watchRamSyncFlags();
            requestAnimationFrame(tick);
        }

        document.getElementById('rom-upload').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                log(`Reading ROM: ${file.name}`);
                startEngine(new Uint8Array(ev.target.result));
            };
            reader.readAsArrayBuffer(file);
        };

        // Key Map using standard keyboard events
        const keyMap = {
            'ArrowRight': JOYP_RIGHT, 
            'ArrowLeft': JOYP_LEFT, 
            'ArrowUp': JOYP_UP, 
            'ArrowDown': JOYP_DOWN, 
            'KeyX': JOYP_B,
            'KeyZ': JOYP_A, 
            'ShiftLeft': JOYP_SELECT,
            'ShiftRight': JOYP_SELECT,
            'Enter': JOYP_START
        };

        const updateJoypad = () => {
            if (!module || !emulatorPtr) return;
            
            // Hook 1: Standard API Call (Multi-name try)
            const setJoyButtons = module._emulator_set_joypad_buttons || module._set_joypad_buttons;
            if (setJoyButtons) {
                setJoyButtons(emulatorPtr, joypadState);
            }
            
            // Hook 2: Individual Bit Setting (Multi-name try)
            const setJoypFn = module._emulator_set_joyp || module._set_joyp || module._emulator_set_joypad;
            if (setJoypFn) {
                for (let i = 0; i < 8; i++) {
                    setJoypFn(emulatorPtr, i, (joypadState >> i) & 1);
                }
            }

            // Hook 3: Raw Memory Manipulation (Direct Hardware Register $FF00)
            // This is the most "forceful" method. 
            // binjgb usually provides access to bus memory.
            const busWrite = module._emulator_write_u8 || module._write_u8;
            if (busWrite) {
                // Game Boy Joypad works on inverted logic (0 = pressed)
                // We'll write to $FF00 (Joypad Register)
                // This might be overridden by the emulator's internal loop, 
                // but we try it as a heartbeat.
                busWrite(emulatorPtr, 0xFF00, (~joypadState) & 0xFF);
            }
        };

        const handleKey = (e, isDown) => {
            const button = keyMap[e.code];
            if (button !== undefined) {
                if (isDown) {
                    joypadState |= (1 << button);
                } else {
                    joypadState &= ~(1 << button);
                }
                e.preventDefault();
                e.stopPropagation();
            }
        };

        // Keyboard listeners on the window for maximum reliability
        window.addEventListener('keydown', (e) => handleKey(e, true), { capture: true });
        window.addEventListener('keyup', (e) => handleKey(e, false), { capture: true });

        // P2P Setup
        const peer = new Peer();
        peer.on('open', (id) => {
            document.getElementById('peer-id').value = id;
            log("P2P Bridge Ready.");
        });

        peer.on('connection', (c) => {
            conn = c;
            isP1 = false;
            setupPeerEvents();
        });

        document.getElementById('connect-btn').onclick = () => {
            const id = document.getElementById('remote-id').value;
            if (!id) return;
            conn = peer.connect(id);
            isP1 = true;
            setupPeerEvents();
        };

        function setupPeerEvents() {
            conn.on('open', () => {
                log(`Linked with Peer as ${isP1 ? 'Host' : 'Guest'}`, "green-400");
                document.getElementById('connection-status').innerHTML = `<span class="status-dot status-online"></span>Linked`;
                document.getElementById('chat-input').disabled = false;
                document.getElementById('chat-send').disabled = false;
                document.getElementById('chat-peer-name').innerText = isP1 ? "Guest" : "Host";
                
                conn.on('data', (packet) => {
                    if (packet.type === 'RAM_SYNC') applyRemoteRam(packet);
                    if (packet.type === 'CHAT') addChatMessage(isP1 ? "Guest" : "Host", packet.text);
                });
            });
        }

        function watchRamSyncFlags() {
            if (!wram || !conn || !conn.open) return;
            const P1_TRIGGER = 0x02FF; 
            const P2_TRIGGER = 0x03FF; 

            if (isP1 && wram[P1_TRIGGER] === 1) {
                const data = Array.from(wram.slice(0x0200, 0x0300));
                conn.send({ type: 'RAM_SYNC', role: 'P1', data: data });
                wram[P1_TRIGGER] = 0; 
                log("Sync: P1 -> Peer", "blue-400");
            }

            if (!isP1 && wram[P2_TRIGGER] === 1) {
                const data = Array.from(wram.slice(0x0300, 0x0400));
                conn.send({ type: 'RAM_SYNC', role: 'P2', data: data });
                wram[P2_TRIGGER] = 0;
                log("Sync: P2 -> Peer", "blue-400");
            }
        }

        function applyRemoteRam(packet) {
            if (!wram) return;
            const offset = packet.role === 'P1' ? 0x0200 : 0x0300;
            const flag = packet.role === 'P1' ? 0x02FF : 0x03FF;
            for (let i = 0; i < packet.data.length; i++) wram[offset + i] = packet.data[i];
            wram[flag] = 1; 
            log(`Sync: Applied ${packet.role} update.`, "green-400");
        }

        function simulateSync(role) {
            if (!wram) return log("Load ROM first!", "red-400");
            wram[role === 'P1' ? 0x02FF : 0x03FF] = 1;
        }

        function addChatMessage(sender, text) {
            const container = document.getElementById('chat-messages');
            if (container.querySelector('.text-center')) container.innerHTML = '';
            const div = document.createElement('div');
            div.className = "mb-2";
            div.innerHTML = `<span class="text-[10px] font-bold text-zinc-500 uppercase">${sender}:</span> <span class="text-xs text-zinc-300">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        const sendMsg = () => {
            const input = document.getElementById('chat-input');
            if (input.value.trim() && conn) {
                conn.send({ type: 'CHAT', text: input.value });
                addChatMessage("Me", input.value);
                input.value = '';
            }
        };

        document.getElementById('chat-send').onclick = sendMsg;
        document.getElementById('chat-input').onkeypress = (e) => e.key === 'Enter' && sendMsg();

        function copyPeerId() {
            navigator.clipboard.writeText(document.getElementById('peer-id').value);
            log("ID copied.");
        }

        function inspectRam() {
            if (wram) console.log("RAM Slice (C200-C3FF):", wram.slice(0x0200, 0x0400));
        }
    </script>
</body>
</html>
